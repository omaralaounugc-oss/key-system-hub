<style>
  :root{
    --label-2:rgba(235,235,245,.60);
    --label-3:rgba(235,235,245,.30);
    --fill:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.16);
    --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#000;-webkit-text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;overflow-x:hidden;
    -webkit-user-select:none;user-select:none}

  /* Backdrop */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#000}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
  .orb.a{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,#2b4a8f 0%,transparent 68%);animation:drift 22s ease-in-out infinite alternate}
  .orb.b{width:60vmax;height:60vmax;right:-25vmax;bottom:-28vmax;background:radial-gradient(circle,#5b2d8a 0%,transparent 68%);animation:drift 26s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(6vmax,4vmax,0)}}

  .screen{position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 18px)}
  .view{flex:1;display:flex;flex-direction:column}
  .hidden{display:none!important}

  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(4px,3vh,28px)}
  .badge{width:56px;height:56px;border-radius:13px;margin-bottom:16px;display:grid;place-items:center;
    background:linear-gradient(160deg,#3a8dff 0%,#0a60ff 55%,#3b3bd6 100%);
    box-shadow:0 10px 30px rgba(10,96,255,.35),inset 0 .5px 0 rgba(255,255,255,.45),inset 0 -.5px 0 rgba(0,0,0,.2)}
  .badge svg{width:26px;height:26px;color:#fff}
  .title{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.022em}
  .sub{font-size:15.5px;line-height:1.38;color:var(--label-2);margin-top:8px;max-width:30ch;letter-spacing:-.011em}

  /* Code cells */
  .cells{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0 14px}
  .group{display:flex;gap:7px}
  .cell{position:relative;width:clamp(40px,12.4vw,48px);height:clamp(54px,15vw,62px);display:grid;place-items:center;border-radius:13px;
    background:var(--fill);border:.5px solid rgba(255,255,255,.07);font-size:clamp(26px,8vw,31px);font-weight:600;letter-spacing:-.02em;
    transition:background .2s,border-color .2s,transform .25s var(--ease)}
  .cell.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.18);animation:pop .22s var(--ease)}
  .cell.cur::after{content:"";width:2px;height:26px;border-radius:1px;background:var(--blue);animation:blink 1.05s steps(1) infinite}
  @keyframes pop{from{transform:scale(.9)}to{transform:none}}
  @keyframes blink{50%{opacity:0}}
  .cells.shake{animation:shake .42s}
  .cells.shake .cell{border-color:rgba(255,69,58,.55)}
  @keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

  /* Paste pill */
  .paste{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px 0 12px;border:.5px solid rgba(255,255,255,.12);border-radius:18px;
    background:var(--fill-2);color:#fff;font:500 15px var(--font);letter-spacing:-.012em;cursor:pointer;
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    transition:transform .2s var(--ease),background .2s}
  .paste:hover{background:rgba(120,120,128,.26)}
  .paste:active{transform:scale(.95)}
  .paste svg{width:17px;height:17px;color:var(--blue)}
  .note{min-height:18px;margin-top:10px;font-size:13px;line-height:1.3;color:var(--label-3);max-width:32ch}
  .error{min-height:18px;margin-top:2px;font-size:13.5px;line-height:1.3;color:var(--red);text-align:center;font-weight:500;letter-spacing:-.008em}
  #ts{display:flex;justify-content:center;margin-top:4px}

  /* Keypad */
  .dock{margin-top:auto;padding-top:12px}
  .pad{--k:clamp(56px,8.8vh,74px);display:grid;grid-template-columns:repeat(3,var(--k));justify-content:space-between;
    gap:clamp(9px,1.6vh,14px) 0;width:min(100%,292px);margin:0 auto}
  .pad button{width:var(--k);height:var(--k);border:none;border-radius:50%;color:#fff;font-family:var(--font);
    background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .35s}
  .pad button:active{background:rgba(255,255,255,.34);transition:none}
  .pad b{font-size:clamp(26px,4vh,32px);font-weight:300;line-height:1}
  .pad small{font-size:9.5px;font-weight:600;letter-spacing:.14em;line-height:1;margin-top:3px;color:rgba(255,255,255,.75);min-height:9px}
  .pad button.t{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;font:500 14px/1 var(--font)}
  .pad button.t:active{background:rgba(255,255,255,.1)}
  .pad svg{width:26px;height:26px}

  .go{display:flex;align-items:center;justify-content:center;width:100%;height:56px;margin-top:16px;border:none;border-radius:16px;
    background:var(--blue);color:#fff;font:600 17px var(--font);letter-spacing:-.015em;cursor:pointer;
    box-shadow:0 8px 24px rgba(10,132,255,.38),inset 0 .5px 0 rgba(255,255,255,.35);
    transition:transform .2s var(--ease),opacity .25s,filter .2s,box-shadow .25s}
  .go:hover{filter:brightness(1.08)}
  .go:active{transform:scale(.975);filter:brightness(.94)}
  .go:disabled{opacity:.5;cursor:default;transform:none}
  .go.idle{background:rgba(120,120,128,.32);box-shadow:none;color:rgba(255,255,255,.55)}

  /* Loading */
  .loading{align-items:center;justify-content:center;text-align:center;gap:6px}
  .ring{width:38px;height:38px;margin:22px auto 0;border:2.5px solid rgba(255,255,255,.14);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Toast */
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;transform:translate(-50%,-140%);opacity:0;
    display:flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 12px;border-radius:21px;font-size:14px;font-weight:500;
    background:rgba(40,40,44,.78);border:.5px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:transform .5s var(--ease),opacity .3s;pointer-events:none}
  .toast svg{width:18px;height:18px;color:var(--green)}
  .toast.show{transform:translate(-50%,0);opacity:1}

  :focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  @media (max-height:700px){.badge{display:none}.cells{margin:16px 0 10px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  Code pasted
</div>

<main class="screen">
  <div id="loading" class="view loading hidden">
    <div class="badge" style="margin:0 auto" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="currentColor" stroke="none"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
    </div>
    <div class="title">Preparing your key</div>
    <div class="sub">This only takes a moment.</div>
    <div class="ring" aria-hidden="true"></div>
  </div>

  <div id="form" class="view">
    <div class="hero">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="currentColor" stroke="none"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
      </div>
      <div class="title">Enter your code</div>
      <div class="sub">Type or paste the 6 digits you saved on the last page.</div>

      <div class="cells" id="cells" role="img" aria-label="Code: 0 of 6 digits entered">
        <span class="group"><i class="cell"></i><i class="cell"></i><i class="cell"></i></span>
        <span class="group"><i class="cell"></i><i class="cell"></i><i class="cell"></i></span>
      </div>

      <button type="button" class="paste" id="paste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="17" rx="3"/><path d="M9 4.5V4a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 4v.5"/></svg>
        Paste code
      </button>
      <div class="note" id="note" role="status" aria-live="polite"></div>
      <div class="error" id="error" role="alert"></div>
      <div id="ts"></div>
    </div>

    <div class="dock">
      <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="------" readonly tabindex="-1" aria-hidden="true" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
      <div class="pad">
        <button type="button" data-d="1"><b>1</b><small></small></button>
        <button type="button" data-d="2"><b>2</b><small>ABC</small></button>
        <button type="button" data-d="3"><b>3</b><small>DEF</small></button>
        <button type="button" data-d="4"><b>4</b><small>GHI</small></button>
        <button type="button" data-d="5"><b>5</b><small>JKL</small></button>
        <button type="button" data-d="6"><b>6</b><small>MNO</small></button>
        <button type="button" data-d="7"><b>7</b><small>PQRS</small></button>
        <button type="button" data-d="8"><b>8</b><small>TUV</small></button>
        <button type="button" data-d="9"><b>9</b><small>WXYZ</small></button>
        <button type="button" class="t" id="forgot">Start over</button>
        <button type="button" data-d="0"><b>0</b><small></small></button>
        <button type="button" class="t" id="del" aria-label="Delete"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H10L3.5 14z"/><path d="M15 11l6 6M21 11l-6 6"/></svg></button>
      </div>
      <button class="go idle" id="submit">Get my key</button>
    </div>
  </div>

</main>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const nonce = params.get('nonce');
  const t = params.get('t');

  const form = document.getElementById('form');
  const loading = document.getElementById('loading');
  const input = document.getElementById('code');
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submit');

  function restart() { window.location.replace('/api/start'); }

  document.getElementById('forgot').addEventListener('click', restart);

  // Valid key already saved in this browser? Skip everything.
  const cachedKey = localStorage.getItem('wowhub_key');
  const cachedExpiry = localStorage.getItem('wowhub_key_expiry');
  if (cachedKey && cachedExpiry) {
    if (new Date(cachedExpiry) > new Date()) {
      goToKey(cachedKey, cachedExpiry);
      return;
    }
    localStorage.removeItem('wowhub_key');
    localStorage.removeItem('wowhub_key_expiry');
  }

  // No session? Start from the beginning.
  if (!nonce || !t) { restart(); return; }

  function goToKey(key, expiresAt) {
    window.location.replace(
      '/index.html?key=' + encodeURIComponent(key) +
      '&expiry=' + encodeURIComponent(expiresAt)
    );
  }

  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '');
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
  });
  btn.addEventListener('click', submit);

  // Cloudflare Turnstile (free). Paste your SITE key here to turn it on.
  const TURNSTILE_SITE_KEY = '0x4AAAAAAF3dS3Ln8Bfv2fv1';
  let tsToken = '';
  let tsWidget = null;
  if (TURNSTILE_SITE_KEY) {
    window.onTurnstileLoad = function () {
      tsWidget = turnstile.render('#ts', {
        sitekey: TURNSTILE_SITE_KEY,
        theme: 'dark',
        callback: (tk) => { tsToken = tk; },
        'expired-callback': () => { tsToken = ''; }
      });
    };
    const sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';
    sc.async = true;
    document.head.appendChild(sc);
  }
  function resetTurnstile() {
    tsToken = '';
    if (TURNSTILE_SITE_KEY && window.turnstile && tsWidget !== null) turnstile.reset(tsWidget);
  }

  async function submit() {
    const code = input.value.trim();
    errorEl.textContent = '';
    if (code.length !== 6) {
      errorEl.textContent = 'Enter the 6 digit number.';
      return;
    }
    if (TURNSTILE_SITE_KEY && !tsToken) {
      errorEl.textContent = 'Please complete the security check.';
      return;
    }

    btn.disabled = true;
    try {
      // 1) check the number
      const r1 = await fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nonce, code, t, ts: tsToken })
      });
      const d1 = await r1.json();
      resetTurnstile();

      if (!r1.ok) {
        errorEl.textContent = d1.error || 'Something went wrong.';
        if (d1.restart) setTimeout(restart, 2000);
        btn.disabled = false;
        return;
      }

      // 2) number is correct -> get the key
      form.classList.add('hidden');
      loading.classList.remove('hidden');

      const r2 = await fetch('/api/getkey?nonce=' + encodeURIComponent(nonce) + '&t=' + encodeURIComponent(t));
      const d2 = await r2.json();

      if (!r2.ok || !d2.key) {
        loading.classList.add('hidden');
        form.classList.remove('hidden');
        errorEl.textContent = d2.error || 'Could not get a key. Try again.';
        btn.disabled = false;
        return;
      }

      localStorage.setItem('wowhub_key', d2.key);
      localStorage.setItem('wowhub_key_expiry', d2.expires_at);
      goToKey(d2.key, d2.expires_at);
    } catch (e) {
      loading.classList.add('hidden');
      form.classList.remove('hidden');
      errorEl.textContent = 'Network error. Try again.';
      btn.disabled = false;
    }
  }
})();
</script>
<script>
// UI layer: the hidden input stays the source of truth; this draws the cells, keypad, paste and feedback.
(function () {
  const input = document.getElementById('code');
  const cellsWrap = document.getElementById('cells');
  const cells = cellsWrap.querySelectorAll('.cell');
  const errorEl = document.getElementById('error');
  const note = document.getElementById('note');
  const form = document.getElementById('form');
  const goBtn = document.getElementById('submit');
  const toast = document.getElementById('toast');
  let toastTimer;

  function draw() {
    const v = input.value;
    cells.forEach((c, i) => {
      c.textContent = v[i] || '';
      c.classList.toggle('on', i < v.length);
      c.classList.toggle('cur', i === v.length && v.length < 6);
    });
    goBtn.classList.toggle('idle', v.length < 6);
    cellsWrap.setAttribute('aria-label', 'Code: ' + v.length + ' of 6 digits entered');
  }
  function set(v) {
    input.value = String(v).replace(/\D/g, '').slice(0, 6);
    input.dispatchEvent(new Event('input', { bubbles: true }));
    note.textContent = '';
    draw();
  }

  // Find a 6-digit code in arbitrary pasted text
  function extract(text) {
    const s = String(text || '');
    const m = s.match(/(?:^|\D)(\d{6})(?:\D|$)/);
    if (m) return m[1];
    const all = s.replace(/\D/g, '');
    return all.length === 6 ? all : '';
  }
  function showToast() {
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
  }
  function accept(code) {
    set(code);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    showToast();
  }

  // Keypad
  document.querySelectorAll('.pad [data-d]').forEach(b =>
    b.addEventListener('click', () => set(input.value + b.dataset.d)));
  document.getElementById('del').addEventListener('click', () => set(input.value.slice(0, -1)));

  // Paste button
  document.getElementById('paste').addEventListener('click', async () => {
    note.textContent = '';
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error('unsupported');
      const text = await navigator.clipboard.readText();
      const code = extract(text);
      if (code) { accept(code); return; }
      const n = (text || '').replace(/\D/g, '').length;
      note.textContent = n ? 'Your clipboard has ' + n + ' digits, not 6.' : 'No 6 digit code found in your clipboard.';
    } catch (e) {
      note.textContent = 'Clipboard access was blocked. Use the keypad, or press Ctrl/\u2318 + V.';
    }
  });

  // Keyboard + system paste (Ctrl/Cmd+V)
  document.addEventListener('keydown', (e) => {
    if (form.classList.contains('hidden') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^\d$/.test(e.key)) set(input.value + e.key);
    else if (e.key === 'Backspace') set(input.value.slice(0, -1));
    else if (e.key === 'Enter') goBtn.click();
  });
  document.addEventListener('paste', (e) => {
    const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
    const digits = text.replace(/\D/g, '');
    if (!digits) return;
    e.preventDefault();
    const code = extract(text);
    if (code) accept(code); else set(digits);
  });

  // Shake on error
  new MutationObserver(() => {
    if (!errorEl.textContent) return;
    cellsWrap.classList.remove('shake'); void cellsWrap.offsetWidth; cellsWrap.classList.add('shake');
  }).observe(errorEl, { childList: true, characterData: true, subtree: true });

  draw();
})();
</script>
</body>
