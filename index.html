<style>
  :root{
    --sec:rgba(235,235,245,.62); --ter:rgba(235,235,245,.34);
    --ok:#30d158; --bad:#ff453a;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,'Roboto Mono',Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  
  /* ANTI SCROLL */
  html, body { height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; position: fixed; width: 100%; background: #06070a; }

  body{font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(70vmax 60vmax at 15% -5%,rgba(96,116,150,.34),transparent 62%),
      radial-gradient(60vmax 55vmax at 105% 105%,rgba(70,78,98,.30),transparent 60%),#06070a}
  .screen{position:absolute;top:0;left:0;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(env(safe-area-inset-bottom,0px) + 22px); align-items: center;}
    
  .content-wrapper { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; }

  .state{display:none;flex:1;flex-direction:column}
  .state.active{display:flex}
  #state-keys,#state-error{justify-content:center}
  
  #state-keys .list{flex:1}
  #state-keys .banner{flex:1;align-items:center}
  #state-error .hero{flex:none;padding-bottom:20px}
  #state-error .mid{flex:1;display:flex;flex-direction:column;gap:16px;width:100%;padding-top:0}
  #state-error .go{flex:1;height:auto;margin-top:0;border-radius:28px;font-size:clamp(24px,7vw,32px)}
  #state-error a.go{display:flex;align-items:center;justify-content:center}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:30px}
  .lock{width:36px;height:46px;margin-bottom:20px;color:#fff}
  .title{font-size:clamp(32px,9vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .sub{font-size:clamp(17px,4.6vw,20px);line-height:1.4;color:var(--sec);margin-top:10px;max-width:30ch}
  .big{font-size:clamp(40px,12vw,56px);font-weight:300;letter-spacing:-.02em;line-height:1.1;max-width:12ch}
  .mid{padding-top:32px}

  .list{display:flex;flex-direction:column;gap:16px}
  .banner{position:relative;display:flex;align-items:flex-start;gap:16px;text-align:left;padding:22px 20px;border-radius:30px;
    background:rgba(52,52,56,.62);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
    transition:transform .15s}
  .banner.has{cursor:pointer}
  .banner.has:active{transform:scale(.97)}
  .banner::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 28%,rgba(255,255,255,.1) 72%,rgba(255,255,255,.3));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  .banner.focus{background:rgba(64,66,74,.78)}
  .icon{flex:none;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  .icon.ok{background:linear-gradient(180deg,#4fd873,#29b84f)}
  .icon.off{background:rgba(255,255,255,.14)}
  .icon svg{width:30px;height:30px}
  .btxt{flex:1;min-width:0}
  .btitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:clamp(19px,5.2vw,23px);font-weight:600;line-height:1.3}
  .btitle small{font-size:clamp(14px,3.8vw,16px);font-weight:400;color:var(--sec)}
  .bbody{margin-top:6px;font-size:clamp(16px,4.4vw,19px);line-height:1.4;color:rgba(235,235,245,.88);word-break:break-all}
  .key-value{font-family:var(--mono);font-weight:500;letter-spacing:.3px;font-size:clamp(18px,5vw,22px);color:#fff}
  .cd{margin-top:10px;font-size:clamp(14.5px,4vw,17px);color:var(--sec)}
  .get{display:block;text-align:center;margin-top:16px;padding:16px 22px;border-radius:16px;background:#fff;color:#000;
    font:600 clamp(16px,4.4vw,19px) var(--font);text-decoration:none}
  .get:active{transform:scale(.97)}
  .hint{text-align:center;font-size:clamp(14.5px,4vw,17px);color:var(--ter);margin-top:20px;transition:color .2s}
  .hint.copied{color:var(--ok)}

  .go{display:block;width:100%;height:68px;margin-top:14px;border:none;border-radius:20px;background:#fff;color:#000;
    font:600 20px var(--font);cursor:pointer;transition:transform .15s}
  .go:active{transform:scale(.98)}
  .go.quiet{background:rgba(255,255,255,.14);color:#fff}
  .ring{width:52px;height:52px;margin-top:30px;border:3.5px solid rgba(255,255,255,.14);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  :focus-visible{outline:2px solid #fff;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}.banner{transition:none}}
  
  /* Hide ads visually but keep them loading and counting */
  .ad-wrapper { position: absolute; z-index: -99; opacity: 0; pointer-events: none; width: 1px; height: 1px; overflow: hidden; }
  .wide, .rail { position: absolute; z-index: -99; opacity: 0; pointer-events: none; height: 0; overflow: hidden; }
</style>
<script>
function adBanner(k,w,h,min){if(innerWidth<min)return;document.write('<scr'+'ipt>atOptions={"key":"'+k+'","format":"iframe","height":'+h+',"width":'+w+',"params":{}};</scr'+'ipt><scr'+'ipt src="https://bauval.org/22/'+k+'"></scr'+'ipt>')}
</script>
</head>
<body>

<!-- HIDDEN ADS (Z-Index -99) -->
<div class="rail l"><script>adBanner('980accb5247e3b507876a5598c5dac63',160,600,840)</script></div>
<div class="rail r"><script>adBanner('e7d297afa4abe6d8e9ae4b6d4a9e413e',160,300,840)</script></div>

<main class="screen">
  <div class="content-wrapper">
    <!-- Hidden Mobile Ads -->
    <div class="ad-wrapper">
      <script>adBanner('c1e961c0589310bb251d53941c12fbb1',320,50,0)</script>
      <script>adBanner('a60c9cdf9090006b20d869deedf8faef',300,250,0)</script>
      <script async="async" data-cfasync="false" src="https://bauval.org/21/83e2d8f4007a7f9643ce1333685516fb"></script>
      <div id="container-83e2d8f4007a7f9643ce1333685516fb"></div>
    </div>

    <section id="state-loading" class="state active">
      <div class="hero">
        <svg class="lock" viewBox="0 0 22 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="11.5" width="18" height="14" rx="3.5" fill="currentColor" stroke="none"/><path d="M6 11.5V8a5 5 0 0 1 10 0v3.5"/></svg>
        <div class="title">Preparing your keys</div>
        <div class="ring" aria-hidden="true"></div>
      </div>
    </section>

    <section id="state-keys" class="state">
      <div class="hero">
        <svg class="lock" viewBox="0 0 22 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="11.5" width="18" height="14" rx="3.5" fill="currentColor" stroke="none"/><path d="M6 11.5V8a5 5 0 0 1 9.6-2"/></svg>
        <div class="title">Your keys</div>
        <div class="sub">Each hub has its own key. A key lasts 12 hours.</div>
      </div>
      <div class="list" id="list"></div>
      <div class="hint" id="copy-hint">Tap a key to copy it, then paste it into the script.</div>
    </section>

    <section id="state-error" class="state">
      <div class="hero">
        <svg class="lock" viewBox="0 0 22 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="11.5" width="18" height="14" rx="3.5" fill="currentColor" stroke="none"/><path d="M6 11.5V8a5 5 0 0 1 10 0v3.5"/></svg>
        <div class="big">Something went wrong</div>
        <div class="sub" id="error-msg">No keys available at the moment</div>
      </div>
      <div class="mid">
        <button class="go" onclick="location.reload()">Try again</button>
        <a class="go quiet" id="restart" href="/api/start" style="text-align:center;text-decoration:none">Start again</a>
      </div>
    </section>
  </div>
</main>

<script>
const HUB_RE = /^[a-z0-9_-]{1,24}$/;
const nameOf = (id) => id.charAt(0).toUpperCase() + id.slice(1);
let HUBS = [];
const LS = 'wowhub_keys';

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

let store = {};
let focus = null;

function load() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }
function showState(id) {
  document.querySelectorAll('.state').forEach((s) => s.classList.remove('active'));
  $(id).classList.add('active');
}
function showError(msg) {
  $('error-msg').textContent = msg;
  $('restart').href = '/api/start' + (focus ? '?hub=' + focus : '');
  showState('state-error');
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function copyKey(key) {
  const hint = $('copy-hint');
  const DEFAULT = 'Tap a key to copy it, then paste it into the script.';
  function done() {
    hint.textContent = 'Copied';
    hint.classList.add('copied');
    setTimeout(() => { hint.textContent = DEFAULT; hint.classList.remove('copied'); }, 2000);
  }
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = key; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(key).then(done, fallback);
  else fallback();
}

function render() {
  const list = $('list');
  list.textContent = '';
  if (!HUBS.length) list.append(el('div', 'sub', 'Open this page from the link inside your script to get a key.'));
  const order = HUBS.slice().sort((a, b) => (b[0] === focus) - (a[0] === focus));
  order.forEach(([id, name]) => {
    const k = store[id];
    const card = el('div', 'banner' + (k ? ' has' : '') + (id === focus ? ' focus' : ''));
    const icon = el('div', 'icon ' + (k ? 'ok' : 'off'));
    icon.innerHTML = k ? CHECK : PLUS;
    const txt = el('div', 'btxt');
    const title = el('div', 'btitle');
    title.append(el('span', null, name), el('small', null, k ? 'Key ready' : 'No key yet'));
    txt.append(title);
    if (k) {
      txt.append(el('div', 'bbody key-value', k.key));
      const cd = el('div', 'cd');
      cd.dataset.hub = id;
      txt.append(cd);
      card.setAttribute('role', 'button');
      card.tabIndex = 0;
      card.onclick = () => copyKey(k.key);
      card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyKey(k.key); } };
    } else {
      txt.append(el('div', 'bbody', 'Get a key to use ' + name + '.'));
      const a = el('a', 'get', 'Get key for ' + name);
      a.href = '/api/start?hub=' + id;
      txt.append(a);
    }
    card.append(icon, txt);
    list.append(card);
  });
  tick();
}

function tick() {
  let changed = false;
  HUBS.forEach(([id]) => {
    if (store[id] && new Date(store[id].expiry) <= new Date()) { delete store[id]; changed = true; }
  });
  if (changed) { save(); render(); return; }
  document.querySelectorAll('.cd').forEach((c) => {
    const k = store[c.dataset.hub];
    if (!k) return;
    const d = new Date(k.expiry) - new Date();
    c.textContent = 'Valid for ' + pad(Math.floor(d / 3600000)) + ':' + pad(Math.floor((d % 3600000) / 60000)) + ':' + pad(Math.floor((d % 60000) / 1000));
  });
}

(async function init() {
  const p = new URLSearchParams(window.location.search);
  const nonce = p.get('nonce'), t = p.get('t');
  focus = p.get('hub');
  if (!HUB_RE.test(focus || '')) focus = null;
  store = load();
  const rebuild = () => { const ids = Object.keys(store).filter((i) => HUB_RE.test(i)); if (focus && !ids.includes(focus)) ids.push(focus); HUBS = ids.map((i) => [i, nameOf(i)]); };
  rebuild();
  localStorage.removeItem('wowhub_key');
  localStorage.removeItem('wowhub_key_expiry');

  if (nonce && t) {
    try {
      const r = await fetch('/api/getkey?nonce=' + encodeURIComponent(nonce) + '&t=' + encodeURIComponent(t));
      const d = await r.json();
      if (!r.ok || !d.key) return showError(d.error || 'Could not get a key. Please start again.');
      store[d.hub] = { key: d.key, expiry: d.expires_at };
      focus = d.hub;
      save();
      rebuild();
    } catch (e) { return showError('Network error. Please refresh.'); }
  } else {
    await Promise.all(HUBS.map(async ([id]) => {
      const k = store[id];
      if (!k) return;
      try {
        const r = await fetch('/api/checkkey?hub=' + id + '&key=' + encodeURIComponent(k.key));
        const d = await r.json();
        if (r.ok && d.valid) k.expiry = d.expires_at; else delete store[id];
      } catch (e) {
        if (new Date(k.expiry) <= new Date()) delete store[id];
      }
    }));
    save();
  }

  rebuild();
  history.replaceState(null, '', window.location.pathname + (focus ? '?hub=' + focus : ''));
  render();
  showState('state-keys');
  setInterval(tick, 1000);
})();
</script>
</body>
