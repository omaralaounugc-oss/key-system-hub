<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    overflow: hidden;
  }
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    background: rgba(100, 100, 255, 0.3);
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 50px;
    width: 420px;
    max-width: 92vw;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .subtitle { color: #aaa; font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-bottom: 30px; }
  .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin-bottom: 30px; }

  /* Loading state */
  .spinner {
    width: 50px; height: 50px;
    border: 3px solid rgba(108,99,255,0.2);
    border-top-color: #6c63ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: #aaa; font-size: 14px; }

  /* Success state */
  .success-icon {
    width: 60px; height: 60px;
    background: rgba(34,197,94,0.15);
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .success-title { color: #22c55e; font-size: 18px; font-weight: bold; margin-bottom: 6px; }
  .success-msg { color: #aaa; font-size: 13px; margin-bottom: 20px; }
  .key-box {
    background: rgba(108,99,255,0.1);
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .key-box:hover { background: rgba(108,99,255,0.2); }
  .key-label { font-size: 11px; color: #888; margin-bottom: 4px; text-align: left; }
  .key-value { font-size: 15px; font-weight: bold; color: white; letter-spacing: 1px; word-break: break-all; text-align: left; }
  .copy-icon { font-size: 20px; opacity: 0.6; }
  .copy-hint { font-size: 11px; color: #666; margin-bottom: 20px; }

  .expires-box {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
  }

  .btn-redirect {
    width: 100%;
    padding: 12px;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-redirect:hover { background: #222; }

  /* Error state */
  .error-icon {
    width: 60px; height: 60px;
    background: rgba(239,68,68,0.15);
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .error-title { color: #ef4444; font-size: 18px; font-weight: bold; margin-bottom: 6px; }
  .error-msg { color: #aaa; font-size: 13px; }

  .footer { margin-top: 20px; font-size: 11px; color: #333; }

  .state { display: none; }
  .state.active { display: block; }
</style>
</head>
<body>

<div id="particles"></div>

<div class="card">
  <div class="subtitle">Key System</div>
  <hr class="divider">

  <!-- Loading -->
  <div id="state-loading" class="state active">
    <div class="spinner"></div>
    <div class="loading-text">Preparing your key...</div>
  </div>

  <!-- Success -->
  <div id="state-success" class="state">
    <div class="success-icon">✅</div>
    <div class="success-title">Your key is ready!</div>
    <div class="success-msg">Copy the key and enter it in the script</div>

    <div class="key-label">Your own key</div>
    <div class="key-box" onclick="copyKey()">
      <div>
        <div class="key-value" id="key-display">-</div>
      </div>
      <div class="copy-icon">📋</div>
    </div>
    <div class="copy-hint" id="copy-hint">Click to copy the key</div>

    <div class="expires-box">
      <span>⏳ Valid until</span>
      <span id="countdown-display" style="font-weight:bold; color:#6c63ff; font-size:15px; letter-spacing:2px;">--:--:--</span>
    </div>
  </div>

  <!-- Expired -->
  <div id="state-expired" class="state">
    <div class="success-icon" style="background:rgba(251,191,36,0.15);">⏰</div>
    <div class="success-title" style="color:#fbbf24;">Your key has expired!</div>
    <div class="success-msg">Get a new one by completing the quick task below</div>
    <button class="btn-redirect" onclick="getNewKey()" style="background:linear-gradient(135deg,#6c63ff,#a78bfa);border:none;margin-top:8px;">
      Create a new one here! →
    </button>
  </div>

  <!-- Error -->
  <div id="state-error" class="state">
    <div class="error-icon">❌</div>
    <div class="error-title">An error occurred</div>
    <div class="error-msg" id="error-msg">No keys available at the moment</div>
  </div>

  <div class="footer">Key System</div>
</div>

<script>
// ── Background particles ──────────────────────────────────────────
const container = document.getElementById('particles');
for (let i = 0; i < 25; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    animation-duration: ${6 + Math.random() * 10}s;
    animation-delay: ${Math.random() * 8}s;
    width: ${1 + Math.random() * 2}px;
    height: ${1 + Math.random() * 2}px;
    opacity: ${0.3 + Math.random() * 0.5};
  `;
  container.appendChild(p);
}

// ── State helpers ─────────────────────────────────────────────────
function showState(id) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function copyKey() {
  const key = document.getElementById('key-display').textContent;
  if (!key || key === '-') return;
  navigator.clipboard.writeText(key).then(() => {
    document.getElementById('copy-hint').textContent = '✅ Copied!';
    setTimeout(() => {
      document.getElementById('copy-hint').textContent = 'Click to copy the key';
    }, 2000);
  });
}

function getNewKey() {
  localStorage.removeItem('wowhub_key');
  localStorage.removeItem('wowhub_key_expiry');
 window.location.href = '/api/start';
}

// ── Countdown timer ───────────────────────────────────────────────
let countdownInterval = null;
function pad(n) { return String(n).padStart(2, '0'); }

function startCountdown(expiryIso) {
  if (countdownInterval) clearInterval(countdownInterval);
  function tick() {
    const diff = new Date(expiryIso) - new Date();
    if (diff <= 0) {
      clearInterval(countdownInterval);
      document.getElementById('countdown-display').textContent = '00:00:00';
      // Key expired while user is looking — show expired state
      localStorage.removeItem('wowhub_key');
      localStorage.removeItem('wowhub_key_expiry');
      showState('state-expired');
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('countdown-display').textContent =
      pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

// ── Main: read key from URL params (or fallback to localStorage) ──
(function init() {
  const params = new URLSearchParams(window.location.search);
  let key    = params.get('key');
  let expiry = params.get('expiry');

  // Fallback: refresh after URL was cleaned → use the saved key
  if (!key || !expiry) {
    key    = localStorage.getItem('wowhub_key');
    expiry = localStorage.getItem('wowhub_key_expiry');
  }

  // Still nothing? User didn't complete the task
  if (!key || !expiry) {
    showState('state-error');
    document.getElementById('error-msg').textContent =
      'No key found. Please complete the task first.';
    return;
  }

  // Key expired?
  if (new Date(expiry) <= new Date()) {
    localStorage.removeItem('wowhub_key');
    localStorage.removeItem('wowhub_key_expiry');
    showState('state-expired');
    return;
  }

  // Save so a refresh still works, then hide key from the address bar
  localStorage.setItem('wowhub_key', key);
  localStorage.setItem('wowhub_key_expiry', expiry);
  history.replaceState(null, '', window.location.pathname);

  document.getElementById('key-display').textContent = key;
  showState('state-success');
  startCountdown(expiry);
})();
</script>
</body>
</html>
